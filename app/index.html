<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nuotit</title>
  <meta name="description" content="Kuoron nuottikirjasto: tallenna PDF-nuotit ja selaa niitä.">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuotit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== Kirjasto ===== -->
  <main id="library" class="library">
    <header class="lib-header">
      <div class="lib-title">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.53 0 1.02.16 1.43.44V5.2l11-2.2v12.5a2.5 2.5 0 1 1-2.5-2.5c.53 0 1.02.16 1.43.44V7.46l-8.86 1.77V18.5z" fill="currentColor"/></svg>
        <h1>Nuotit</h1>
      </div>
      <label class="btn btn-primary" id="add-btn">
        <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
        <span aria-hidden="true">＋</span> Lisää nuotteja
      </label>
    </header>

    <div class="lib-tools">
      <input type="search" id="search" placeholder="Hae nimellä, säveltäjällä tai tunnisteella" autocomplete="off" aria-label="Hae nuotteja">
      <select id="sort" aria-label="Järjestys">
        <option value="title">Nimi A–Ö</option>
        <option value="recent">Viimeksi avatut</option>
        <option value="added">Viimeksi lisätyt</option>
        <option value="manual">Oma järjestys</option>
      </select>
    </div>
    <div id="tag-filter" class="tag-filter" hidden></div>

    <section id="grid" class="grid" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.53 0 1.02.16 1.43.44V5.2l11-2.2v12.5a2.5 2.5 0 1 1-2.5-2.5c.53 0 1.02.16 1.43.44V7.46l-8.86 1.77V18.5z" fill="currentColor"/></svg>
      <h2>Ei vielä nuotteja</h2>
      <p>Lisää PDF-nuotit painamalla <b>Lisää nuotteja</b> tai raahaa tiedostot tähän.</p>
    </div>
    <div id="no-results" class="empty small" hidden>
      <p>Haulla ei löytynyt nuotteja.</p>
    </div>

    <footer id="lib-footer" class="lib-footer"></footer>
  </main>

  <!-- ===== Katselin ===== -->
  <section id="viewer" class="viewer" hidden aria-label="Nuottikatselin">
    <div id="stage" class="stage"></div>
    <div class="flash flash-left" id="flash-left"></div>
    <div class="flash flash-right" id="flash-right"></div>
    <div class="page-badge" id="page-badge" aria-live="polite"></div>

    <div id="tap-hint" class="tap-hint" hidden>
      <div class="hint-zone"><span>‹</span>Edellinen sivu</div>
      <div class="hint-zone mid">Napauta: valikko<br><br>Kaksoisnapauta tai<br>nipistä: zoomaa</div>
      <div class="hint-zone"><span>›</span>Seuraava sivu</div>
    </div>

    <header class="v-bar v-top">
      <button class="v-btn" id="v-back" aria-label="Takaisin kirjastoon">‹ Kirjasto</button>
      <div class="v-title" id="v-title"></div>
      <button class="v-btn" id="v-draw" title="Merkinnät" aria-label="Tee merkintöjä">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
      </button>
      <div class="v-zoom" role="group" aria-label="Zoomaus">
        <button class="v-btn" id="v-zoom-out" aria-label="Loitonna">−</button>
        <button class="v-btn" id="v-zoom-label" title="Palauta koko sivu">100 %</button>
        <button class="v-btn" id="v-zoom-in" aria-label="Lähennä">+</button>
      </div>
      <button class="v-btn" id="v-full" title="Koko näyttö" aria-label="Koko näyttö">⛶</button>
    </header>
    <footer class="v-bar v-bottom">
      <button class="v-btn" id="v-prev" aria-label="Edellinen sivu">‹</button>
      <input type="range" id="v-slider" min="1" max="1" value="1" aria-label="Siirry sivulle">
      <span class="v-page" id="v-page">1 / 1</span>
      <button class="v-btn" id="v-next" aria-label="Seuraava sivu">›</button>
    </footer>
    <div id="v-msg" class="v-msg" hidden></div>

    <!-- Merkintätyökalut (piirtotila) -->
    <div class="d-bar" id="d-bar" role="toolbar" aria-label="Merkinnät" hidden>
      <button class="d-btn" data-tool="black" aria-label="Musta kynä" title="Musta kynä"><span class="swatch" style="--c:#1b1b1b"></span></button>
      <button class="d-btn" data-tool="red" aria-label="Punainen kynä" title="Punainen kynä"><span class="swatch" style="--c:#d32f2f"></span></button>
      <button class="d-btn" data-tool="blue" aria-label="Sininen kynä" title="Sininen kynä"><span class="swatch" style="--c:#1565c0"></span></button>
      <button class="d-btn" data-tool="hl" aria-label="Korostus" title="Korostus"><span class="swatch hl"></span></button>
      <button class="d-btn" data-tool="eraser" aria-label="Pyyhekumi" title="Pyyhekumi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.24 3.56l4.95 4.94a1.5 1.5 0 0 1 0 2.12L12.4 19.4H19v2H7.83l-4.99-5a1.5 1.5 0 0 1 0-2.12L14.12 3.56a1.5 1.5 0 0 1 2.12 0zM5 15.35l4.07 4.05h.5l3.06-3.06-4.95-4.95L5 15.35z" fill="currentColor"/></svg>
      </button>
      <span class="d-sep"></span>
      <button class="d-btn" id="d-undo" aria-label="Kumoa" title="Kumoa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.95 7.95 0 0 1 12.5 10.5c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" fill="currentColor"/></svg>
      </button>
      <button class="d-btn" id="d-clear" aria-label="Poista sivun merkinnät" title="Poista sivun merkinnät">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>
      </button>
      <span class="d-sep"></span>
      <button class="d-btn d-nav" id="d-prev" aria-label="Edellinen sivu" title="Edellinen sivu">‹</button>
      <button class="d-btn d-nav" id="d-next" aria-label="Seuraava sivu" title="Seuraava sivu">›</button>
      <button class="d-btn d-done" id="d-done">Valmis</button>
    </div>
  </section>

  <!-- ===== Muokkausikkuna ===== -->
  <dialog id="edit-dialog" class="dialog">
    <form method="dialog" id="edit-form">
      <h2>Nuotin tiedot</h2>
      <label>Nimi
        <input name="title" required autocomplete="off">
      </label>
      <label>Säveltäjä / sovittaja
        <input name="composer" autocomplete="off">
      </label>
      <label>Tunnisteet <small>(pilkulla erotettuna, esim. kevätkonsertti, joulu)</small>
        <input name="tags" autocomplete="off">
      </label>
      <p class="meta" id="edit-meta"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-danger" id="edit-delete">Poista</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="edit-cancel">Peruuta</button>
        <button type="submit" class="btn btn-primary" value="save">Tallenna</button>
      </div>
    </form>
  </dialog>

  <div id="drop-overlay" class="drop-overlay" hidden>Pudota PDF-tiedostot tähän</div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
